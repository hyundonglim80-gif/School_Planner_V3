<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>업무 및 수업 계획표</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="title-group">
        <h1>🗓️ 업무 및 수업 계획표</h1>
      </div>
      <div class="control-panel">
        
        <div class="btn-group">
          <button class="btn-scope" onclick="setScope('memo')">📝</button>
          <button class="btn-scope" onclick="setScope('year')">년</button>
          <button class="btn-scope" onclick="setScope('month')">월</button>
          <button class="btn-scope active" onclick="setScope('week')">주</button>
          <button class="btn-scope" onclick="setScope('day')">일</button>
        </div>

        <div class="mode-group">
          <button class="btn-mode active-viewer" id="btn-mode-viewer" onclick="setMode('viewer')">👁️ 뷰어</button>
          <button class="btn-mode" id="btn-mode-editor" onclick="setMode('editor')">✏️ 수정</button>
        </div>

        <div class="action-group">
          <div class="more-menu-wrapper">
            <button class="btn-more" id="btn-more-toggle" onclick="toggleMoreMenu(event)" title="더보기 메뉴">⋮</button>
            <div class="more-dropdown-menu" id="more-dropdown-menu">
              <button onclick="exportDataJSON()">💾 데이터 백업 (JSON)</button>
              <button onclick="importDataJSON()">📥 데이터 대량 등록 (JSON)</button>
              <hr class="dropdown-divider">
              <button onclick="openTimetableModal()">⚙️ 기준시간표 등록 및 기간 적용</button>
            </div>
          </div>

          <button id="btn-save-data" class="btn-save hidden" onclick="saveCurrentViewData()">
            💾 저장
          </button>
        </div>

      </div>
    </div>
    <div class="header-bottom">
      <div class="nav-bar">
        <button class="nav-btn" onclick="moveDate(-1)">&lt; 이전</button>
        <span class="current-range" id="date-range-text">2026년 7월 3주차 (07.20 ~ 07.24)</span>
        <button class="nav-btn" onclick="moveDate(1)">다음 &gt;</button>
      </div>
    </div>
  </header>

  <main class="main-container" id="main-view"></main>

  <div id="timetable-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ 1학기 / 2학기 기준시간표 설정 및 적용</h2>
        <button class="btn-close-modal" onclick="closeTimetableModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="tab-group">
          <button class="tab-btn active" id="tab-sem-1" onclick="switchSemesterTab(1)">1학기 기준시간표</button>
          <button class="tab-btn" id="tab-sem-2" onclick="switchSemesterTab(2)">2학기 기준시간표</button>
        </div>

        <div class="timetable-editor-container">
          <table class="timetable-editor-table">
            <thead>
              <tr>
                <th>교시</th>
                <th>월요일</th>
                <th>화요일</th>
                <th>수요일</th>
                <th>목요일</th>
                <th>금요일</th>
              </tr>
            </thead>
            <tbody id="timetable-editor-tbody">
              </tbody>
          </table>
        </div>

        <div style="text-align: right; margin-top: 10px;">
          <button class="btn-secondary" onclick="saveTimetableConfig()">💾 현재 학기 기준시간표 저장</button>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

        <div class="apply-range-section">
          <h3>📅 기준시간표 기간 일괄 적용</h3>
          <p class="section-desc">지정한 기간 내의 모든 평일(월~금)에 선택한 학기의 기준시간표를 자동으로 채워 넣습니다.</p>
          <div class="range-form">
            <label>학기 선택:
              <select id="apply-semester-select">
                <option value="1">1학기 기준시간표</option>
                <option value="2">2학기 기준시간표</option>
              </select>
            </label>
            <label>시작일:
              <input type="date" id="apply-start-date">
            </label>
            <label>종료일:
              <input type="date" id="apply-end-date">
            </label>
            <button class="btn-primary" onclick="applyTimetableToRange()">🚀 기간 적용 실행</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

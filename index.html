<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>School Planner</title>
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>

  <div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background:#fff; padding:50px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center;">
          <h1 style="margin-bottom:10px; font-size: clamp(1.5rem, 5vw, 2rem); color:var(--primary-color); white-space: nowrap; overflow: hidden;">School Planner</h1>
          <p style="color:#64748b; font-size: 1.2rem; margin-bottom:40px;">나만의 데이터를 안전하게 동기화하기 위해<br>구글 계정으로 시작해주세요.</p>
          <button onclick="signInWithGoogle()" style="background:#4285f4; color:#fff; border:none; padding:15px 32px; border-radius:8px; font-size:1.1rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:12px; margin:0 auto; box-shadow:0 4px 6px rgba(66,133,244,0.2);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.18 1-.78 1.85-1.63 2.53v2.1h2.64c1.55-1.42 2.43-3.5 2.43-6.64z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-2.64-2.1c-.98.66-2.23 1.06-3.64 1.06-2.86 0-5.29-1.93-6.16-4.53H4.06v2.13C5.87 20.25 8.69 23 12 23z" fill="#34A853"/><path d="M5.84 14.77c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V8.46H4.06C3.38 9.8 3 11.31 3 12.68s.38 2.88 1.06 4.22l1.78-2.13z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 8.69 1 5.87 3.75 4.06 6.46l1.78 2.13c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google 계정으로 로그인
          </button>
      </div>
  </div>

  <div id="app" style="display:none;">
    <header class="app-header">
      <div class="header-row">
        <div class="title-group">
          <h1>School Planner</h1>
        </div>

        <div class="btn-group">
          <button class="btn-scope" onclick="window.setScope('year')">년</button>
          <button class="btn-scope" onclick="window.setScope('month')">월</button>
          <button class="btn-scope" onclick="window.setScope('week')">주</button>
          <button class="btn-scope" onclick="window.setScope('day')">일</button>
          <button class="btn-scope" onclick="window.setScope('memo')">업무</button>
        </div>

        <div class="mode-group">
          <button id="btn-mode-viewer" class="btn-mode" onclick="window.setMode('viewer')">👁️ 보기</button>
          <button id="btn-mode-editor" class="btn-mode" onclick="window.setMode('editor')">✏️ 작성</button>
        </div>

        <div id="dday-container" style="display:inline-block; cursor:pointer;" onclick="window.openDdayModal()">
           <span id="dday-badge" class="badge-tag" style="background:#fef08a; color:#854d0e; font-size:0.9rem; padding:4px 8px; border-radius:6px; font-weight:bold;">D-Day 설정</span>
        </div>

        <button id="btn-search" class="nav-btn" onclick="window.openSearchModal()" style="display:none;">🔍 검색</button>
        <button id="btn-toggle-class" class="nav-btn" onclick="window.toggleClass()">🎒 수업 숨기기</button>

        <div style="position:relative; display:inline-block;">
            <button id="btn-more-menu" class="nav-btn" onclick="window.toggleMoreMenu(event)">⋮</button>
            <div id="more-menu-dropdown" class="dropdown-menu hidden">
                <button class="dropdown-item" onclick="window.openTimetableModal()">🗓️ 기준시간표 관리</button>
                <button class="dropdown-item" onclick="window.openRecurringModal()">🔁 반복 일정 관리</button>
                <button class="dropdown-item" onclick="window.openLabelsModal()">🏷️ 일정/일지 라벨 관리</button>
                <button class="dropdown-item" onclick="window.openBackupModal()">💾 데이터 백업 및 복원</button>
                <button class="dropdown-item" onclick="window.openSettingsModal()">⚙️ 환경 설정</button>
                <button class="dropdown-item" onclick="window.openHelpModal()">❓ 사용 설명서</button>
            </div>
        </div>

        <div id="user-info" style="display:flex; align-items:center; gap:8px;">
            <span id="user-name" style="font-weight:bold; font-size:0.9rem; color:#475569;"></span>
            <button onclick="signOutWithGoogle()" class="nav-btn" style="padding:3px 8px; font-size:0.8rem; color:#ef4444; border-color:#fca5a5;">로그아웃</button>
        </div>
      </div>

      <div class="header-row" id="nav-bar-row" style="justify-content:center;">
        <div class="nav-bar" style="display:flex; align-items:center; gap:10px;">
          <button class="nav-btn" onclick="window.navigateDate(-1)">◀ 이전</button>
          <span id="current-range" class="current-range"></span>
          <button class="nav-btn" onclick="window.navigateDate(1)">다음 ▶</button>
          <button class="nav-btn" onclick="window.goToToday()">오늘</button>
          <button id="btn-toggle-weekend" class="nav-btn" onclick="window.toggleWeekend()">📅 주말 숨기기</button>
        </div>
      </div>
    </header>

    <main class="main-container">
      <div id="main-view"></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/components/BaseView.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/help.js"></script>
  <script src="js/modules/search.js"></script>
  <script src="js/modules/recurring.js"></script>
  <script src="js/modules/labels.js"></script>
  <script src="js/modules/timetable.js"></script>
  <script src="js/modules/backup.js"></script>
  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>
  <script src="js/modules/sync.js"></script>
  
  <div id="image-viewer-modal" class="modal-overlay hidden" style="z-index: 10010;">
    <div class="modal-content" style="width: auto; max-width: 95vw; background: transparent; box-shadow: none;">
      <div style="text-align: right; margin-bottom: 8px;">
        <button onclick="document.getElementById('image-viewer-modal').classList.add('hidden')" style="background: rgba(0,0,0,0.7); color: white; border: none; font-size: 1.5rem; padding: 4px 12px; border-radius: 50%; cursor: pointer;">✕</button>
      </div>
      <img id="enlarged-image" src="" alt="확대 이미지" style="max-width: 100%; max-height: 80vh; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: block; margin: 0 auto;">
    </div>
  </div>

</body>
</html>

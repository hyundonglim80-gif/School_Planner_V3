<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>업무 및 수업 계획표</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background:#fff; padding:50px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center;">
          <h1 style="margin-bottom:10px; font-size: 2rem; color:var(--primary-color);">🗓️ 업무 및 수업 계획표</h1>
          <p style="color:#64748b; font-size: 1.2rem; margin-bottom:40px;">나만의 데이터를 안전하게 동기화하기 위해<br>구글 계정으로 시작해주세요.</p>
          <button onclick="signInWithGoogle()" style="background:#4285F4; color:#fff; border:none; padding:12px 24px; font-size:1.2rem; border-radius:8px; cursor:pointer; font-weight:bold; display:flex; align-items:center; gap:10px; margin:0 auto; box-shadow: 0 4px 6px rgba(66, 133, 244, 0.3); transition: 0.2s;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google 계정으로 로그인
          </button>
      </div>
  </div>

  <header class="app-header">
    <div class="header-top">
      <div class="title-group">
        <h1>🗓️ 업무 및 수업 계획표</h1>
      </div>
      <div class="control-panel">
        <div class="btn-group">
          <button class="btn-scope" onclick="setScope('memo')">📝</button>
          <button class="btn-scope" onclick="setScope('year')">년</button>
          <button class="btn-scope" onclick="setScope('month')">월</button>
          <button class="btn-scope active" onclick="setScope('week')">주</button>
          <button class="btn-scope" onclick="setScope('day')">일</button>
        </div>
        
        <div class="mode-group" style="position: relative;">
          <button class="btn-mode active-viewer" id="btn-mode-viewer">👁️ 뷰어</button>
          <button class="btn-mode" id="btn-mode-editor" style="width: 120px; justify-content: center; white-space: nowrap;">✏️ 수정</button>
          
          <button class="btn-mode" id="btn-more-menu" onclick="toggleMoreMenu()" style="display: none; padding: 5px 10px; justify-content: center;">⋮</button>
          
          <div id="more-dropdown" class="dropdown-menu hidden">
            <button class="dropdown-item" onclick="openTimetableModal()">🗓️ 기준시간표 등록/적용</button>
            <button class="dropdown-item" onclick="downloadCSV()">📥 백업 다운로드 (CSV)</button>
            <button class="dropdown-item" onclick="document.getElementById('upload-csv-file').click()">📤 업로드/동기화 (CSV)</button>
          </div>
          <input type="file" id="upload-csv-file" accept=".csv" style="display:none;" onchange="uploadCSV(this)">
        </div>

        <div id="user-info" style="display:none; align-items:center; gap:8px; margin-left:10px; padding-left:12px; border-left:2px solid #cbd5e1;">
            <img id="user-photo" src="" style="width:32px; height:32px; border-radius:50%; border:1px solid #cbd5e1;" title="내 프로필">
            <button onclick="signOut()" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.95rem; font-weight:bold; color:#475569; transition: 0.2s;">로그아웃</button>
        </div>

      </div>
    </div>
    
    <div class="header-bottom">
      <div class="nav-bar">
        <button class="nav-btn" id="btn-search" onclick="openSearchModal()" style="margin-right: 10px; display: none; background-color: #f1f5f9; color: #0f172a; border-color: #cbd5e1;">🔍 검색</button>
        
        <button class="nav-btn" id="btn-toggle-weekend" onclick="toggleWeekend()" style="margin-right: 15px; background-color: #f1f5f9; color: #3b82f6; border-color: #bfdbfe;">📅 주말 보기</button>
        
        <button class="nav-btn" onclick="moveDate(-1)">&lt; 이전</button>
        <span class="current-range" id="date-range-text">...</span>
        <button class="nav-btn" onclick="moveDate(1)">다음 &gt;</button>
      </div>
    </div>
  </header>

  <main class="main-container" id="main-view"></main>

  <div id="timetable-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🗓️ 기준시간표 등록 및 적용</h2>
        <button class="modal-close" onclick="closeTimetableModal()">✖</button>
      </div>
      <div class="modal-body">
        <div class="timetable-section">
          <h3>1. 기준시간표 등록</h3>
          <select id="tt-semester-select" onchange="loadBaseTimetable()">
            <option value="1">1학기</option>
            <option value="2">2학기</option>
          </select>
          <table class="timetable-input-table">
            <thead>
              <tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>
            </thead>
            <tbody id="tt-tbody">
              </tbody>
          </table>
          <button class="btn-save-tt" onclick="saveBaseTimetable()">💾 기준시간표 클라우드에 저장</button>
        </div>
        <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 20px 0;">
        <div class="timetable-section">
          <h3>2. 일정 기간에 일괄 적용</h3>
          <div class="apply-group">
            <select id="apply-semester">
              <option value="1">1학기 시간표 적용</option>
              <option value="2">2학기 시간표 적용</option>
            </select>
            <input type="date" id="apply-start-date"> ~ <input type="date" id="apply-end-date">
            <button class="btn-apply-tt" onclick="applyBaseTimetable()">🚀 일괄 적용</button>
          </div>
          <p class="apply-warning">* 주의: 선택하신 기간의 평일(월~금)에 기준시간표 '과목'이 덮어씌워집니다.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="search-modal" class="modal-overlay hidden" style="z-index: 10000; background: #f8fafc;">
    <div style="width: 100%; height: 100%; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1);">
      
      <div style="padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #fff;">
        <h2 style="margin: 0; font-size: 1.5rem; color: #1e293b;">🔍 상세 검색 (<span id="search-scope-label" style="color: #3b82f6;"></span>)</h2>
        <button onclick="closeSearchModal()" style="font-size: 1.8rem; background: none; border: none; cursor: pointer; color: #64748b;">✖</button>
      </div>
      
      <div style="padding: 20px; border-bottom: 2px solid #f1f5f9; background: #fff;">
        <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 15px;">
          * 아래 버튼을 눌러 원하는 검색 조건을 추가하세요. 띄어쓰기나 쉼표(,)로 여러 단어 입력 가능.
        </p>
        
        <div id="search-filter-buttons" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
          <button onclick="addSearchField('event')" id="btn-add-event" style="background:#e0f2fe; color:#0284c7; border:1px solid #38bdf8; padding:8px 15px; border-radius:20px; font-weight:bold; cursor:pointer; transition:0.2s;">+ 일정</button>
          <button onclick="addSearchField('subject')" id="btn-add-subject" style="background:#dcfce3; color:#059669; border:1px solid #34d399; padding:8px 15px; border-radius:20px; font-weight:bold; cursor:pointer; transition:0.2s;">+ 과목명</button>
          <button onclick="addSearchField('memo')" id="btn-add-memo" style="background:#f3e8ff; color:#6d28d9; border:1px solid #c084fc; padding:8px 15px; border-radius:20px; font-weight:bold; cursor:pointer; transition:0.2s;">+ 수업 메모</button>
          <button onclick="addSearchField('supplies')" id="btn-add-supplies" style="background:#ffedd5; color:#ea580c; border:1px solid #fdba74; padding:8px 15px; border-radius:20px; font-weight:bold; cursor:pointer; transition:0.2s;">+ 준비물</button>
        </div>

        <div id="active-search-fields" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
          </div>
        
        <button onclick="executeSearch()" style="width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;">🚀 데이터 찾기</button>
      </div>

      <div style="flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc;">
        <div id="search-results-count" style="margin-bottom: 15px; font-weight: bold; color: #2563eb; font-size: 1.1rem;"></div>
        <div id="search-results-list" style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px;">
          </div>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/timetable.js"></script>
  
  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>

</body>
</html>

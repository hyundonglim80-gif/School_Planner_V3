<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>School Planner</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

  <div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background:#fff; padding:50px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center;">
          <h1 style="margin-bottom:10px; font-size: clamp(1.5rem, 5vw, 2rem); color:var(--primary-color); white-space: nowrap; overflow: hidden;">School Planner</h1>
          <p style="color:#64748b; font-size: 1.2rem; margin-bottom:40px;">나만의 데이터를 안전하게 동기화하기 위해<br>구글 계정으로 시작해주세요.</p>
          <button onclick="signInWithGoogle()" style="background:#4285F4; color:#fff; border:none; padding:12px 24px; border-radius:8px; font-size:1.1rem; font-weight:bold; cursor:pointer; box-shadow:0 4px 12px rgba(66,133,244,0.3); transition:all 0.2s;">Google 계정으로 로그인</button>
      </div>
  </div>

  <header class="app-header">
    <div class="header-top">
      <h1 class="app-title">School Planner</h1>
      <div class="header-center-tabs">
        <button id="btn-search" class="btn-scope" onclick="window.openSearchModal()" title="검색 (단축키: /)">🔍</button>
        <button class="btn-scope" onclick="setScope('memo')">메모</button>
        <button class="btn-scope" onclick="setScope('year')">년</button>
        <button class="btn-scope" onclick="setScope('month')">월</button>
        <button class="btn-scope" onclick="setScope('week')">주</button>
        <button class="btn-scope" onclick="setScope('day')">일</button>
      </div>
      
      <div id="user-info" style="display:none; align-items:center; gap:10px;">
        <img id="user-photo" src="" style="width:32px; height:32px; border-radius:50%;">
        <button onclick="signOutWithGoogle()" style="background:none; border:1px solid #cbd5e1; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.8rem;">로그아웃</button>
      </div>
    </div>

    <div class="header-bottom">
      <div class="nav-bar">
        <button class="nav-btn" onclick="moveDate(-1)">이전</button>
        <div style="display:flex; align-items:center; gap:8px;">
            <span id="date-range-text" class="current-range" onclick="goToToday()" title="오늘 날짜로 이동" style="cursor:pointer; padding:4px 10px; border-radius:6px; transition:0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='transparent'"></span>
            <div id="dday-container" style="position:relative; display:inline-block;"></div>
        </div>
        <button class="nav-btn" onclick="moveDate(1)">다음</button>

        <button id="btn-toggle-weekend" class="nav-btn" onclick="toggleWeekend()">주말 보이기</button>
        <button id="btn-toggle-class" class="nav-btn" onclick="toggleClass()">수업 숨기기</button>

        <div class="mode-group" style="display: flex;">
          <button id="btn-mode-viewer" class="btn-mode active-viewer" onclick="setMode('viewer')">뷰어</button>
          <button id="btn-mode-editor" class="btn-mode" onclick="handleEditSaveClick()">작성</button>
        </div>

        <button id="btn-more-menu" class="nav-btn" onclick="toggleMoreMenu()" title="더보기" style="display: inline-flex;">⋮</button>
      </div>
      
      <div id="more-dropdown" class="dropdown-menu hidden">
        <button class="dropdown-item" onclick="window.openEventLabelModal()">🏷️ 일정 라벨 관리</button>
        <button class="dropdown-item" onclick="window.openJournalLabelModal()">📔 일지 라벨 관리</button>
        <button class="dropdown-item" onclick="window.openSettingsModal()">⚙️ 환경 설정</button>
        <button class="dropdown-item" onclick="window.openRecurringModal()">🔄 반복 일정 등록</button>
        <button class="dropdown-item" onclick="window.openTimetableModal()">📅 기준 시간표 등록/적용</button>
        <button class="dropdown-item" onclick="window.openSyncModal()">📅 구글 캘린더/Tasks 동기화</button>
        <button class="dropdown-item" onclick="window.downloadCSV()">💾 통합 백업 (CSV)</button>
        <button class="dropdown-item" onclick="document.getElementById('csv-file-input').click()">📤 백업 복원 (CSV)</button>
        <button class="dropdown-item" onclick="window.openHelpModal()">📖 사용 설명서</button>
        <input type="file" id="csv-file-input" accept=".csv" style="display:none;" onchange="window.uploadCSV(this)">
      </div>
    </div>
  </header>

  <main id="main-view"></main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/components/BaseView.js"></script>

  <script src="js/app.js"></script>
   
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/help.js"></script>
  <script src="js/modules/search.js"></script>
  <script src="js/modules/recurring.js"></script>
  <script src="js/modules/labels.js"></script>
  <script src="js/modules/timetable.js"></script>
  <script src="js/modules/backup.js"></script>
  <script src="js/modules/dday.js"></script>
  <script src="js/modules/sync.js"></script>
  
  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>

</body>
</html>

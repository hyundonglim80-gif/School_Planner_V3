<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>업무 및 수업 계획표</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="title-group">
        <h1>🗓️ 업무 및 수업 계획표</h1>
      </div>
      <div class="control-panel">
        <div class="btn-group">
          <button class="btn-scope" onclick="setScope('memo')">📝</button>
          <button class="btn-scope" onclick="setScope('year')">년</button>
          <button class="btn-scope" onclick="setScope('month')">월</button>
          <button class="btn-scope active" onclick="setScope('week')">주</button>
          <button class="btn-scope" onclick="setScope('day')">일</button>
        </div>
        
        <div class="mode-group" style="position: relative;">
          <button class="btn-mode active-viewer" id="btn-mode-viewer">👁️ 뷰어</button>
          <button class="btn-mode" id="btn-mode-editor" style="width: 120px; justify-content: center; white-space: nowrap;">✏️ 수정</button>
          
          <button class="btn-mode" id="btn-more-menu" onclick="toggleMoreMenu()" style="display: none; padding: 5px 10px; justify-content: center;">⋮</button>
          
          <div id="more-dropdown" class="dropdown-menu hidden">
            <button class="dropdown-item" onclick="downloadCSV()">📥 백업 다운로드 (CSV)</button>
            <button class="dropdown-item" onclick="document.getElementById('upload-csv-file').click()">📤 업로드/동기화 (CSV)</button>
          </div>
          <input type="file" id="upload-csv-file" accept=".csv" style="display:none;" onchange="uploadCSV(this)">
        </div>
      </div>
    </div>
    
    <div class="header-bottom">
      <div class="nav-bar">
        <button class="nav-btn" onclick="moveDate(-1)">&lt; 이전</button>
        <span class="current-range" id="date-range-text">2026년 7월 3주차 (07.20 ~ 07.24)</span>
        <button class="nav-btn" onclick="moveDate(1)">다음 &gt;</button>
      </div>
    </div>
  </header>

  <main class="main-container" id="main-view"></main>

  <script src="js/data.js"></script>

  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1000">
  <title>School Planner</title>
  <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

  <div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-body); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <div style="background:#fff; padding:50px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center;">
          <h1 style="margin-bottom:10px; font-size: clamp(1.5rem, 5vw, 2rem); color:var(--primary-color); white-space: nowrap; overflow: hidden;">School Planner</h1>
          <p style="color:#64748b; font-size: 1.2rem; margin-bottom:40px;">나만의 데이터를 안전하게 동기화하기 위해<br>구글 계정으로 시작해주세요.</p>
          <button onclick="signInWithGoogle()" style="background:#4285F4; color:#fff; border:none; padding:12px 24px; font-size:1.2rem; border-radius:8px; cursor:pointer; font-weight:bold; display:flex; align-items:center; gap:10px; margin:0 auto; box-shadow: 0 4px 6px rgba(66, 133, 244, 0.3); transition: 0.2s;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google 계정으로 로그인
          </button>
      </div>
  </div>

  <header class="app-header">
    <div class="header-top">
      <div class="title-group" style="min-width: 0; flex-shrink: 1;">
        <h1 style="white-space: nowrap !important; font-size: clamp(1.1rem, 3vw, var(--font-header-title, 1.5rem)) !important; overflow: hidden; text-overflow: ellipsis; margin: 0;">업무 및 수업 계획표</h1>
      </div>
      <div class="control-panel">
        <button class="nav-btn" id="btn-search" onclick="openSearchModal()" title="단축키: / (슬래시)" style="background-color: #f1f5f9; color: #0f172a; border-color: #cbd5e1;">검색</button>

        <div class="mode-group">
          <button class="btn-mode" id="btn-mode-viewer" title="단축키: Ctrl + ↑">보기</button>
          <button class="btn-mode" id="btn-mode-editor" title="단축키: Ctrl + ↓" style="width: 80px; justify-content: center; white-space: nowrap;">작성</button>
        </div>

        <div class="btn-group" title="보기 이동 단축키: Shift + ← / →">
          <button class="btn-scope" onclick="setScope('memo')">메모</button>
          <button class="btn-scope" onclick="setScope('year')">년간</button>
          <button class="btn-scope" onclick="setScope('month')">월간</button>
          <button class="btn-scope" onclick="setScope('week')">주간</button>
          <button class="btn-scope" onclick="setScope('day')">하루</button>
        </div>
        
        <div style="position: relative;">
          <button class="btn-mode" id="btn-more-menu" onclick="toggleMoreMenu()" style="padding: 5px 10px; justify-content: center; font-weight: bold;" title="더보기 및 메뉴">⋮</button>
          
          <div id="more-dropdown" class="dropdown-menu hidden">
              <button class="dropdown-item" onclick="document.getElementById('more-dropdown').classList.add('hidden'); window.openMemoLabelModal();">메모 라벨 관리</button>
              <button class="dropdown-item" onclick="window.openEventLabelModal()">일정 라벨 관리</button>
              <button class="dropdown-item" onclick="window.openJournalLabelModal()">기록 라벨 관리</button>
              <button class="dropdown-item" onclick="window.openSettingsModal()">수업 명칭 및 시수 관리</button>
              <button class="dropdown-item" onclick="window.openRecurringEventModal()">반복 일정 등록</button>
              <button class="dropdown-item" onclick="openTimetableModal()">시간표 적용</button>
              <button class="dropdown-item" onclick="document.getElementById('more-dropdown').classList.add('hidden'); window.openGoogleSyncModal();" style="font-weight:bold; ">구글 서비스 동기화</button>
              <button class="dropdown-item" onclick="document.getElementById('more-dropdown').classList.add('hidden'); window.BackupManager.openModal()">내보내기/가져오기</button>
              <button class="dropdown-item" onclick="openHelpModal()">사용 설명서</button>
          </div>
        </div>

        <div id="user-info" style="display:none; align-items:center; gap:8px; margin-left:10px; padding-left:12px; border-left:2px solid #cbd5e1;">
            <img id="user-photo" src="" style="width:32px; height:32px; border-radius:50%; border:1px solid #cbd5e1;" title="내 프로필">
            <button onclick="if(window.currentMode==='editor' && window.hasUnsavedChanges && !confirm('저장하지 않은 데이터가 있습니다. 정말 로그아웃 하시겠습니까?')) return; signOut()" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:0.95rem; font-weight:bold; color:#475569; transition: 0.2s;">로그아웃</button>
        </div>
      </div>
    </div>
    
    <div class="header-bottom">
      <div class="nav-bar" style="display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%;">
        <div style="display: flex; gap: 8px;">
          <button class="nav-btn" id="btn-toggle-weekend" onclick="toggleWeekend()" style="background-color: #f1f5f9; color: #3b82f6; border-color: #bfdbfe;">주말 숨기기</button>
          <button class="nav-btn" id="btn-toggle-class" onclick="toggleClass()" style="background-color: #f1f5f9; color: #10b981; border-color: #a7f3d0; font-weight:bold;">수업 숨기기</button>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; margin: 0 10px;">
          <button class="nav-btn" onclick="moveDate(-1)" title="단축키: Ctrl + ←">&lt; 이전</button>
          <span class="current-range" id="date-range-text" onclick="goToToday()" style="cursor:pointer; transition: color 0.2s; min-width: 200px; text-align: center;" onmouseover="this.style.color='#1a73e8'" onmouseout="this.style.color='#0f172a'" title="오늘 날짜로 돌아가기 (단축키: Ctrl + 스페이스바)">...</span>
          <button class="nav-btn" onclick="moveDate(1)" title="단축키: Ctrl + →">다음 &gt;</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container" id="main-view"></main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  
  <script src="js/firebase.js"></script>
  
  <script src="js/core/utils.js"></script>
  <script src="js/core/events.js"></script>
  
  <script src="js/components/Modal.js"></script>
  <script src="js/components/BaseView.js"></script>

  <script src="js/app.js"></script>
   
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/help.js"></script>
  <script src="js/modules/search.js"></script>
  <script src="js/modules/recurring.js"></script>
  <script src="js/modules/labels.js"></script>
  <script src="js/modules/timetable.js"></script>
  <script src="js/modules/backup.js"></script>
  
  <script src="js/viewWeek.js"></script>
  <script src="js/viewDay.js"></script>
  <script src="js/viewMonth.js"></script>
  <script src="js/viewYear.js"></script>
  <script src="js/viewMemo.js"></script>

  <script src="js/modules/sync.js"></script>
  
  <div id="image-viewer-modal" class="modal-overlay hidden" style="z-index: 10006; flex-direction: column;" onclick="this.classList.add('hidden')">
      <img id="full-size-image" src="" style="max-width: 90%; max-height: 85vh; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); object-fit: contain;">
      <span style="color: white; margin-top: 15px; font-size: 1.2rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;">화면 아무 곳이나 클릭하면 닫힙니다</span>
  </div>

</body>
</html>

<div id="event-label-modal" class="modal-overlay hidden" style="z-index: 10003; background: rgba(0,0,0,0.5);">
    <div style="background:#fff; padding:25px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:2px solid #bfdbfe; padding-bottom:10px;">
        <h3 style="margin:0; color:#1e40af; font-size:1.3rem;">🏷️ 일정 라벨 관리</h3>
        <button onclick="document.getElementById('event-label-modal').classList.add('hidden')" style="font-size:1.5rem; background:none; border:none; cursor:pointer; color:#64748b;">✖</button>
      </div>
      
      <p style="font-size:0.9rem; color:#475569; margin-bottom:15px; line-height:1.4;">
        일정에 사용할 라벨을 정의합니다. <br><b>'수업 삭제'</b>를 체크하면, 해당 라벨이 붙은 날은 시간표 일괄 적용 시 수업이 자동으로 비워집니다.
      </p>

      <div id="event-label-list-container" style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px; max-height:300px; overflow-y:auto; padding-right:5px;">
        </div>

      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="text" id="new-label-name" placeholder="새 라벨 이름 (예: 단축수업)" style="flex:1; padding:8px; border:1px solid #cbd5e1; border-radius:6px; outline:none;">
        <label style="display:flex; align-items:center; gap:4px; font-size:0.85rem; color:#ef4444; font-weight:bold; cursor:pointer;">
          <input type="checkbox" id="new-label-skip" style="width:16px; height:16px; accent-color:#ef4444;">
          수업 삭제
        </label>
        <button onclick="addNewEventLabel()" style="background:#2563eb; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">추가</button>
      </div>

      <div style="display:flex; justify-content:flex-end;">
        <button onclick="saveEventLabels()" style="background:#16a34a; color:#fff; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:1.05rem; width:100%;">💾 변경사항 저장</button>
      </div>
    </div>
  </div>
